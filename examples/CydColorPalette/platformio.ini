; PlatformIO Project Configuration File
; ESP32-2432S028R (CYD — Cheap Yellow Display)
;
; Build:  pio run -e cyd_28r
; Upload: pio run -e cyd_28r -t upload
; Monitor: pio device monitor

[platformio]
default_envs = cyd_28r
src_dir = .

[env:cyd_28r]
platform    = espressif32@6.9.0
board       = esp32dev
framework   = arduino
upload_speed = 921600
monitor_speed = 115200

lib_deps =
    ; CatppuccinRGB565 — local parent library
    symlink://../..
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    ; TFT_eSPI — ILI9341 via VSPI
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; XPT2046 is driven by XPT2046_Touchscreen, not TFT_eSPI
    -D TOUCH_CS=-1
    ; Disable unused TFT_eSPI fonts to save flash
    -D LOAD_GLCD=1
    -D LOAD_FONT2=0
    -D LOAD_FONT4=0
    -D LOAD_FONT6=0
    -D LOAD_FONT7=0
    -D LOAD_FONT8=0
    -D LOAD_GFXFF=0
    -D SMOOTH_FONT=0
    ; Include library src
    -I ../../src
