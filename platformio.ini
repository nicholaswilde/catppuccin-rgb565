; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
test_dir = tests

[env]
check_src_filters =
    +<src/>
check_flags =
    cppcheck: --suppress=*:*/.pio/*
    cppcheck: --suppress=unmatchedSuppression

[env:native]
platform = native
build_flags =
    -D NATIVE_TEST=1
    -I src/
